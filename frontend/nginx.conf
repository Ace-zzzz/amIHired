server {
    listen 80;       # listen for browser requests on port 80
    server_name _;   # _ means "accept any domain name"

    root  /usr/share/nginx/html;  # where our built React files live
    index index.html;             # the entry point file

    # ── Compression ─────────────────────────────────────────
    # Gzip shrinks files before sending them to the browser.
    # Smaller files = faster load times.
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               text/javascript;

    # ── Static asset caching ────────────────────────────────
    # Tell the browser to cache JS/CSS/images for 1 year.
    # Vite adds unique hashes to filenames (e.g. main.a3f9c2.js)
    # so new deployments automatically bust the cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API Proxy ───────────────────────────────────────────
    # Any request starting with /api/ gets forwarded to Spring Boot.
    # The browser talks to Nginx on port 80 — Nginx quietly
    # forwards it to the backend container on port 8080.
    # "backend" is the service name from docker-compose.yml —
    # Docker's internal network resolves it automatically.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── SPA Fallback ────────────────────────────────────────
    # This is critical for React Router.
    # Without this: user visits /jobs → Nginx looks for a file
    # called "jobs" → doesn't exist → returns 404.
    # With this: Nginx always returns index.html and lets
    # React Router handle the URL client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}